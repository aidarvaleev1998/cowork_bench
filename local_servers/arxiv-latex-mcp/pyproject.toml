[project]
name = "arxiv-latex-mcp"
version = "0.2.1"
description = "An MCP server that fetches and processes arXiv papers using LaTeX source for accurate equation handling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.6.0",
    "arxiv-to-prompt>=0.10.0",
    "psycopg2-binary>=2.9.11",
]

[tool.uv]
# Pin to the package versions of the previous prod image
# (harbor-main:native-mcp-f784db8-20260818). The rebuild of
# 2026-10-19 re-resolved unpinned deps: mcp 2.3.0 removed
# lowlevel Server.list_resources() (clickhouse/hr1c crash), and
# failed resolution left the Word / arxiv-latex venvs empty.
constraint-dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.12.1",
    "arxiv-to-prompt==0.10.0",
    "attrs==25.4.0",
    "certifi==2026.1.4",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "click==8.3.1",
    "cryptography==46.0.5",
    "filelock==3.24.3",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx-sse==0.4.3",
    "httpx==0.28.1",
    "idna==3.11",
    "jsonschema==4.26.0",
    "markdown-it-py==4.0.0",
    "mcp==1.26.0",
    "mdurl==0.1.2",
    "psycopg2-binary==2.9.11",
    "pycparser==3.0",
    "pydantic-core==2.41.5",
    "pydantic-settings==2.13.1",
    "pydantic==2.12.5",
    "pygments==2.19.2",

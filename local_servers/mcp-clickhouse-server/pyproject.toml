[project]
name = "mcp_snowflake_server"
version = "0.4.0"
description = "A simple Snowflake MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.0.0",
    "snowflake-connector-python[pandas]>=3.12.0,<3.14.0",
    "pandas>=2.2.3",
    "python-dotenv>=1.0.1",
    "sqlparse>=0.5.3",
    "snowflake-snowpark-python>=1.26.0",
    "tomli>=2.0.1",
    "cryptography<43.0.0",
    "pyOpenSSL>=24.0.0",
    "setuptools>=82.0.0",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Pin to the package versions of the previous prod image
# (harbor-main:native-mcp-f784db8-20260818); see smoke r11 2026-10-22.
constraint-dependencies = [
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "asn1crypto==1.5.1",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "cffi==1.17.1",
    "charset-normalizer==3.4.9",
    "click==8.4.2",
    "cloudpickle==2.2.1",
    "cryptography==42.0.8",
    "filelock==3.32.2",
    "h11==0.16.0",
    "httpcore2==2.10.0",
    "httpx2==2.10.0",
    "idna==3.18",
    "iniconfig==2.3.0",
    "jsonschema-specifications==2025.9.1",
    "jsonschema==4.26.0",
    "mcp==1.26.0",
    "nodeenv==1.10.0",
    "numpy==2.5.2",
    "opentelemetry-api==1.44.0",
    "packaging==26.3",
    "pandas==2.3.3",
    "platformdirs==4.11.2",
    "pluggy==1.6.0",
    "protobuf==5.29.6",
    "psycopg2-binary==2.9.12",
    "pyarrow==25.0.1",
    "pycparser==3.0",
    "pydantic-core==2.46.4",
    "pydantic==2.13.4",
    "pygments==2.20.0",
    "pyjwt==2.13.0",
    "pyopenssl==24.3.0",
    "pyright==1.1.411",
    "pytest-asyncio==1.4.0",
    "pytest==9.1.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "pytz==2026.3.post1",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "requests==2.34.2",
    "rpds-py==2026.6.3",
    "setuptools==84.0.0",
    "six==1.17.0",
    "snowflake-snowpark-python==1.28.0",
    "sortedcontainers==2.4.0",
    "sqlparse==0.5.5",
    "sse-starlette==3.4.8",
    "starlette==1.6.0",
    "tomli==2.4.1",
    "tomlkit==0.15.1",
    "truststore==0.10.4",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.3",
    "tzdata==2026.3",
    "tzlocal==5.4.4",
    "urllib3==2.7.0",
    "uvicorn==0.52.1",
    "wheel==0.47.0",
]

dev-dependencies = ["pyright>=1.1.389"]

[project.scripts]
mcp_snowflake_server = "mcp_snowflake_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_snowflake_server"]

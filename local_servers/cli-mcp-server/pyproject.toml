[project]
name = "cli-mcp-server"
version = "0.2.5"
description = "Command line interface for MCP clients with secure execution and customizable security policies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.10.1"]
authors = [
    { name = "Mladen", email = "fangs-lever6n@icloud.com" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
cli-mcp-server = "cli_mcp_server:main"

[project.urls]
Homepage = "https://github.com/MladenSU/cli-mcp-server"
Documentation = "https://github.com/MladenSU/cli-mcp-server#readme"
Repository = "https://github.com/MladenSU/cli-mcp-server.git"
"Bug Tracker" = "https://github.com/MladenSU/cli-mcp-server/issues"

[tool.uv]
# Pin to the package versions of the previous prod image
# (harbor-main:native-mcp-f784db8-20260818). The rebuild of
# 2026-10-19 re-resolved unpinned deps: mcp 2.3.0 removed
# lowlevel Server.list_resources() (clickhouse/hr1c crash), and
# failed resolution left the Word / arxiv-latex venvs empty.
constraint-dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.9.0",
    "attrs==25.3.0",
    "certifi==2025.1.31",
    "click==8.1.8",
    "h11==0.14.0",
    "httpcore==1.0.8",
    "httpx-sse==0.4.0",
    "httpx==0.28.1",
    "idna==3.10",
    "jsonschema==4.24.0",
    "mcp==1.10.1",
    "pydantic-core==2.33.1",
    "pydantic-settings==2.9.1",
    "pydantic==2.11.3",
    "python-dotenv==1.1.0",
    "python-multipart==0.0.20",
    "referencing==0.36.2",
    "rpds-py==0.26.0",
    "sniffio==1.3.1",
    "sse-starlette==2.2.1",
    "starlette==0.46.2",
    "typing-extensions==4.13.2",
    "typing-inspection==0.4.0",
    "uvicorn==0.34.2",
]

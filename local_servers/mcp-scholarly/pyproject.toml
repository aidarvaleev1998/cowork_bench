[project]
name = "mcp-scholarly"
version = "0.1.0"
description = "A MCP server to search for accurate academic articles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
 "arxiv>=2.1.3",
 "free-proxy>=1.1.3",
 "mcp>=1.1.2",
 "scholarly>=1.7.11",
 "psycopg2-binary>=2.9",
]
[[project.authors]]
name = "Aditya Karnam"
email = "akarnam37@gmail.com"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.scripts]
mcp-scholarly = "mcp_scholarly:main"

[tool.uv]
# Pin to the package versions of the previous prod image
# (harbor-main:native-mcp-f784db8-20260818). The rebuild of
# 2026-10-19 re-resolved unpinned deps: mcp 2.3.0 removed
# lowlevel Server.list_resources() (clickhouse/hr1c crash), and
# failed resolution left the Word / arxiv-latex venvs empty.
